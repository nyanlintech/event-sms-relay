AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Event SMS Relay - Guest management and notification system
Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Runtime: nodejs18.x
    Environment:
      Variables:
        NODE_ENV: prod
Resources:
  EventSmsRelayFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: event-sms-relay
      CodeUri: EventSmsRelayFunction
      Handler: handler.handler
      Environment:
        Variables:
          NODE_ENV: prod
          DEBUG: false
      Policies:
      - Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Action:
          - ssm:GetParameter
          - ssm:GetParameters
          Resource:
            Fn::Sub: arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/event-sms-relay/*
      Events:
        ProcessGuests:
          Type: Api
          Properties:
            RestApiId:
              Ref: EventSmsRelayApi
            Path: /process
            Method: post
        GetGuestsSummary:
          Type: Api
          Properties:
            RestApiId:
              Ref: EventSmsRelayApi
            Path: /guests/summary
            Method: get
        GetGuests:
          Type: Api
          Properties:
            RestApiId:
              Ref: EventSmsRelayApi
            Path: /guests
            Method: get
    Metadata:
      SamResourceId: EventSmsRelayFunction
  EventSmsRelayApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: event-sms-relay-api
      StageName: prod
      Cors:
        AllowMethods: '''GET,POST,OPTIONS'''
        AllowHeaders: '''Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'''
        AllowOrigin: '''*'''
  FunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/event-sms-relay
      RetentionInDays: 14
Outputs:
  ApiGatewayUrl:
    Description: API Gateway endpoint URL
    Value:
      Fn::Sub: https://${EventSmsRelayApi}.execute-api.${AWS::Region}.amazonaws.com/prod
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-api-url
  FunctionName:
    Description: Lambda Function Name
    Value:
      Ref: EventSmsRelayFunction
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-function-name
